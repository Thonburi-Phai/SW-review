# OpenOCD config for NXP S32K116 via MCU-Link (CMSIS-DAP SWD).
# Defers the S32K target setup to upstream tcl/target/s32k.cfg.

adapter driver cmsis-dap
transport select swd
adapter speed 1000

source [find target/s32k.cfg]

# MCU-Link routes nRST to the chip — make SRST available for `reset halt`.
reset_config srst_only srst_nogate
